<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12513a">
<title>Cadastrar mercado | Lista Certa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f2ea;--card:#fffdf8;--ink:#1b2a22;--muted:#5f6f66;--line:#e4dfd2;--green:#12513a;--green2:#1c7a57;--mint:#dff2e6;--gold:#f2c23c;--bad:#b4432f}
@media (prefers-color-scheme:dark){:root{--bg:#101813;--card:#18231d;--ink:#e8efe9;--muted:#9aaba1;--line:#26352c;--green:#8fdcb4;--green2:#4fb585;--mint:#1c3829;--bad:#e8806c}}
*{box-sizing:border-box;margin:0}
body{font-family:"DM Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;padding:0 0 50px}
header{background:#12513a;color:#fff;padding:16px 20px}
header a{color:#fff;text-decoration:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:19px}
main{max-width:560px;margin:0 auto;padding:26px 18px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:30px;line-height:1.08;color:var(--green);margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
input{width:100%;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--green2);box-shadow:0 0 0 3px rgba(28,122,87,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;width:100%;margin-top:16px;padding:15px;border-radius:14px;border:0;background:#12513a;color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.6}
.btn.sec{background:transparent;color:var(--green);border:1.5px solid var(--green2);margin-top:10px}
.erro{color:var(--bad);font-size:14px;margin-top:10px}
.chaves{background:#fff8e1;border:1.5px solid var(--gold);color:#3b2c00;border-radius:16px;padding:16px;margin-bottom:16px}
@media (prefers-color-scheme:dark){.chaves{background:#2a2410;color:#f3e3a8}}
.chaves h2{font-size:17px;margin-bottom:4px}.chaves p{font-size:13.5px;margin-bottom:8px}
.kv{display:flex;gap:8px;align-items:center;margin:6px 0 12px}
.kv code{flex:1;word-break:break-all;background:rgba(0,0,0,.07);padding:9px 10px;border-radius:9px;font-size:12.5px}
.kv button{padding:9px 12px;border-radius:9px;border:0;background:#12513a;color:#fff;font-weight:700;cursor:pointer}
.rot{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
ol{padding-left:20px;font-size:14.5px;color:var(--muted);margin-top:8px}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:26px}.foot a{color:var(--green);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<header><a href="/">← Lista Certa</a></header>
<main>
  <h1>Cadastre seu mercado</h1>
  <p class="sub">Em um minuto você recebe as chaves da API e já pode enviar os preços do seu sistema. Sem aprovação, sem custo.</p>

  <div id="resultado" hidden></div>

  <form class="card" id="form">
    <label for="nome">Nome do mercado</label><input id="nome" required maxlength="120" autocomplete="organization">
    <label for="cidade">Cidade</label><input id="cidade" required maxlength="80" placeholder="Gramado">
    <label for="email">E-mail para contato</label><input id="email" type="email" required maxlength="160" autocomplete="email">
    <label for="cnpj">CNPJ (opcional: preenche o nome e a cidade sozinho)</label><input id="cnpj" inputmode="numeric" placeholder="00.000.000/0001-00"><small id="cnpjDica" style="display:block;font-size:12.5px;color:var(--muted);margin-top:4px;min-height:16px"></small>
    <button class="btn" type="submit" id="enviar">Cadastrar e receber as chaves</button>
    <p class="erro" id="erro" role="alert"></p>
  </form>
  <p class="foot">Feito com ❤️ por <a href="https://portfolio-daniel-seckler.vercel.app" target="_blank" rel="noopener">Seckler Digital</a> · <a href="/docs">Documentação da API</a> · <a href="/termos">Termos</a> · <a href="/privacidade">Privacidade</a></p>
</main>
<script>
const $=s=>document.querySelector(s);
(function(){ /* CNPJ: busca os dados públicos na Receita e preenche nome e cidade vazios */
  let ultimo="";const el=$("#cnpj"),dica=$("#cnpjDica");
  async function buscar(){
    const c=el.value.replace(/\D/g,"");
    if(c.length!==14){if(c.length<14){dica.textContent="";ultimo=""}return}
    if(c===ultimo)return;ultimo=c;dica.style.color="";dica.textContent="Consultando a Receita…";
    try{
      const r=await fetch("/api/v1/cnpj?cnpj="+c),d=await r.json().catch(()=>({}));
      if(!r.ok||!d.ok){dica.textContent=r.status===400?(d.msg||"CNPJ inválido."):"Não consegui consultar agora. Preencha manualmente.";dica.style.color=r.status===400?"var(--bad)":"";return}
      if(!d.encontrado){dica.textContent="CNPJ não encontrado na Receita. Confira os números.";dica.style.color="var(--bad)";return}
      if(!$("#nome").value.trim())$("#nome").value=d.nome;
      if(!$("#cidade").value.trim())$("#cidade").value=d.cidade;
      dica.textContent=`${d.razaoSocial||d.nome} · ${d.cidade}/${d.uf} · ${d.ativa?"situação ATIVA ✓":"situação: "+d.situacao+" (não será aceito)"}`;
      dica.style.color=d.ativa?"var(--green2)":"var(--bad)";
    }catch(e){dica.textContent="Não consegui consultar agora. Preencha manualmente."}
  }
  el.addEventListener("input",buscar);el.addEventListener("blur",buscar);
})();
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("#form").onsubmit=async e=>{
  e.preventDefault();$("#erro").textContent="";$("#enviar").disabled=true;$("#enviar").textContent="Cadastrando…";
  try{
    const r=await fetch("/api/v1/cadastro",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nome:$("#nome").value,cidade:$("#cidade").value,email:$("#email").value,cnpj:$("#cnpj").value||undefined})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok||!d.ok)throw new Error(d.msg||"Não consegui cadastrar agora.");
    $("#form").hidden=true;const el=$("#resultado");el.hidden=false;
    el.innerHTML=`<div class="chaves"><h2>${esc(d.mercado.nome)} cadastrado ✓</h2><p><b>Guarde agora.</b> As chaves não aparecem de novo.</p>
      <div class="rot">Teste (homologação)</div><div class="kv"><code>${esc(d.chaves.teste)}</code><button data-c="${esc(d.chaves.teste)}">Copiar</button></div>
      <div class="rot">Produção</div><div class="kv"><code>${esc(d.chaves.producao)}</code><button data-c="${esc(d.chaves.producao)}">Copiar</button></div></div>
      <div class="card"><b>Próximos passos</b><ol><li>Integre com a chave de <b>teste</b>: ela grava num ambiente separado.</li><li>Quando estiver certo, troque para a chave de <b>produção</b>.</li><li>Envie os preços por código de barras (GTIN), em lote.</li></ol>
      <a class="btn" style="text-decoration:none" href="/docs">Abrir a documentação</a></div>`;
    el.scrollIntoView({behavior:"smooth"});
  }catch(err){$("#erro").textContent=err.message==="Failed to fetch"?"Sem conexão com o servidor.":err.message;$("#enviar").disabled=false;$("#enviar").textContent="Cadastrar e receber as chaves"}
};
document.addEventListener("click",async e=>{const b=e.target.closest("[data-c]");if(!b)return;try{await navigator.clipboard.writeText(b.dataset.c);b.textContent="Copiado ✓"}catch(x){b.textContent="Selecione e copie"}});
</script>
<script src="/atualizacao.js" data-versao="/api/versao" defer></script>
</body>
</html>
